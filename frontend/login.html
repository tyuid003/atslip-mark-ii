<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>เข้าสู่ระบบ — ATslip Mark-II</title>
  <link rel="icon" type="image/gif" href="assets/images/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/variables.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Kanit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--color-gray-50); color: var(--color-gray-900); min-height: 100vh; display: flex; flex-direction: column; }
    .login-header { background: var(--color-white); border-bottom: 1px solid var(--color-gray-200); padding: 0 1.5rem; height: 47px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-sm); }
    .login-header-title { display: flex; align-items: center; gap: 0.75rem; }
    .login-header-title h1 { font-size: 0.95rem; font-weight: 700; color: var(--color-gray-900); }
    .login-header-badge { background: var(--color-primary-light); color: var(--color-primary); padding: 2px 10px; border-radius: 9999px; font-size: 0.7rem; font-weight: 600; }
    .login-page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .login-card { background: var(--color-white); border: 1px solid var(--color-gray-200); border-radius: 1rem; box-shadow: var(--shadow-lg); width: 100%; max-width: 400px; padding: 2.25rem 2rem; }
    .login-icon { width: 56px; height: 56px; background: var(--color-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; }
    .login-icon svg { color: white; }
    .login-card-title { text-align: center; margin-bottom: 0.4rem; }
    .login-card-title h2 { font-size: 1.35rem; font-weight: 700; }
    .login-card-subtitle { text-align: center; color: var(--color-gray-500); font-size: 0.83rem; margin-bottom: 1.75rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 1rem; }
    .form-label { font-size: 0.8rem; font-weight: 500; color: var(--color-gray-700); }
    .form-input-wrap { position: relative; }
    .form-input { width: 100%; padding: 0.6rem 0.85rem 0.6rem 2.5rem; border: 1px solid var(--color-gray-300); border-radius: 0.5rem; font-size: 0.875rem; font-family: inherit; color: var(--color-gray-900); background: white; transition: border-color 0.15s; }
    .form-input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .form-input-icon { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); color: var(--color-gray-400); pointer-events: none; }
    .form-input-toggle { position: absolute; right: 0.7rem; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 0; cursor: pointer; color: var(--color-gray-400); }
    .form-input-toggle:hover { color: var(--color-gray-600); }
    .form-input.has-toggle { padding-right: 2.5rem; }
    .alert { padding: 0.65rem 0.85rem; border-radius: 0.5rem; font-size: 0.8rem; line-height: 1.5; margin-bottom: 1rem; display: none; }
    .alert.show { display: block; }
    .alert-error { background: var(--color-danger-light); color: #991b1b; border-left: 3px solid var(--color-danger); }
    .alert-success { background: var(--color-success-light); color: #065f46; border-left: 3px solid var(--color-success); }
    .btn { width: 100%; padding: 0.65rem 1rem; border-radius: 0.5rem; font-size: 0.9rem; font-weight: 600; font-family: inherit; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: opacity 0.15s, transform 0.1s; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: var(--color-primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.35); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #successScreen { display: none; flex-direction: column; align-items: center; gap: 0.75rem; text-align: center; }
    .success-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--color-gray-200); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .success-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .success-name { font-size: 1.1rem; font-weight: 700; }
    .success-sub { font-size: 0.8rem; color: var(--color-gray-500); }
    .success-check { width: 52px; height: 52px; background: var(--color-success-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .login-footer-note { text-align: center; font-size: 0.75rem; color: var(--color-gray-400); margin-top: 1.5rem; }
  </style>
</head>
<body>
  <header class="login-header">
    <div class="login-header-title">
      <h1>ATslip Mark-II</h1>
      <span class="login-header-badge">v2.0</span>
    </div>
    <a href="/" style="font-size:0.8rem;color:var(--color-gray-500);text-decoration:none;display:inline-flex;align-items:center;gap:4px">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      เลือกทีม
    </a>
  </header>

  <div class="login-page">
    <div class="login-card">
      <div id="successScreen">
        <div class="success-avatar" id="successAvatar">
          <i data-lucide="user" size="32" style="color:var(--color-gray-400)"></i>
        </div>
        <div class="success-check">
          <i data-lucide="check" size="24" style="color:var(--color-success)"></i>
        </div>
        <div class="success-name" id="successName"></div>
        <div class="success-sub">เข้าสู่ระบบสำเร็จ</div>
        <p style="font-size:0.8rem;color:var(--color-gray-500)">กำลังพาคุณไปยังหน้าหลัก...</p>
      </div>

      <div id="loginForm">
        <div class="login-icon"><i data-lucide="shield-check" size="26"></i></div>
        <div class="login-card-title"><h2>เข้าสู่ระบบ</h2></div>
        <p class="login-card-subtitle" id="loginSubtitle">กรุณากรอก Username และ Password</p>
        <div class="alert" id="loginAlert"></div>
        <div class="form-group">
          <label class="form-label" for="usernameInput">Username</label>
          <div class="form-input-wrap">
            <span class="form-input-icon"><i data-lucide="user" size="15"></i></span>
            <input type="text" id="usernameInput" class="form-input" placeholder="username" autocomplete="username" autocapitalize="none" spellcheck="false" onkeydown="if(event.key==='Enter'){document.getElementById('passwordInput').focus()}">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="passwordInput">Password</label>
          <div class="form-input-wrap">
            <span class="form-input-icon"><i data-lucide="lock" size="15"></i></span>
            <input type="password" id="passwordInput" class="form-input has-toggle" placeholder="รหัสผ่าน" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
            <button class="form-input-toggle" type="button" onclick="togglePasswordVisibility()" tabindex="-1" aria-label="แสดง/ซ่อนรหัสผ่าน">
              <i data-lucide="eye" id="togglePwIcon" size="15"></i>
            </button>
          </div>
        </div>
        <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">
          <i data-lucide="log-in" size="16"></i>
          เข้าสู่ระบบ
        </button>
      </div>

      <p class="login-footer-note">
        <i data-lucide="lock" size="11" style="vertical-align:middle"></i>
        ระบบปลอดภัยด้วย PBKDF2 Password Hashing
      </p>
    </div>
  </div>

  <script src="js/config.js?v=2.4"></script>
  <script>
    const BACKEND = window.AUTH_CONFIG?.BACKEND_URL ?? '';
    const _urlParams = new URLSearchParams(location.search);
    const _teamSlug  = (_urlParams.get('team') || '').replace(/[^a-z0-9-]/g, '');

    function getOrCreateDeviceToken() {
      let t = localStorage.getItem('atslip_device_token');
      if (!t) { t = crypto.randomUUID(); localStorage.setItem('atslip_device_token', t); }
      return t;
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('passwordInput');
      const icon  = document.getElementById('togglePwIcon');
      if (input.type === 'password') { input.type = 'text'; icon.setAttribute('data-lucide', 'eye-off'); }
      else                           { input.type = 'password'; icon.setAttribute('data-lucide', 'eye'); }
      lucide.createIcons();
    }

    function showAlert(type, msg) {
      const el = document.getElementById('loginAlert');
      el.textContent = msg;
      el.className = 'alert show alert-' + type;
    }
    function hideAlert() { document.getElementById('loginAlert').className = 'alert'; }

    async function doLogin() {
      const username = document.getElementById('usernameInput').value.trim().toLowerCase();
      const password = document.getElementById('passwordInput').value;
      if (!username || !password) { showAlert('error', 'กรุณากรอก Username และ Password'); return; }

      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> กำลังเข้าสู่ระบบ...';
      hideAlert();

      try {
        const deviceToken = getOrCreateDeviceToken();
        const res  = await fetch(`${BACKEND}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, device_token: deviceToken }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error ?? 'เข้าสู่ระบบล้มเหลว');

        localStorage.setItem('atslip_session', data.app_session_token);
        localStorage.setItem('atslip_device_token', data.device_token || deviceToken);
        localStorage.setItem('atslip_user', JSON.stringify(data.user));
        if (data.user.photo) localStorage.setItem('atslip_photo', data.user.photo);
        else                 localStorage.removeItem('atslip_photo');

        showSuccess(data.user);
        setTimeout(() => {
          const p = new URLSearchParams(location.search);
          const teamSlug = (p.get('team') || '').replace(/[^a-z0-9-]/g, '');
          let redirect = p.get('next') || (teamSlug ? '/#/' + teamSlug : '/');
          if (redirect.startsWith('#')) redirect = '/' + redirect;
          location.href = redirect;
        }, 1400);
      } catch (e) {
        showAlert('error', e.message || 'เข้าสู่ระบบล้มเหลว');
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="log-in" size="16"></i> เข้าสู่ระบบ';
        lucide.createIcons();
      }
    }

    function showSuccess(user) {
      document.getElementById('loginForm').style.display = 'none';
      const ss = document.getElementById('successScreen');
      ss.style.display = 'flex';
      document.getElementById('successName').textContent = user.display_name || user.username || 'ผู้ใช้';
      if (user.photo) document.getElementById('successAvatar').innerHTML = '<img src="' + user.photo + '" alt="avatar">';
      lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      if (_teamSlug) {
        const subtitle = document.getElementById('loginSubtitle');
        if (subtitle) subtitle.textContent = 'เข้าสู่ระบบทีม: ' + _teamSlug;
      }
      const session = localStorage.getItem('atslip_session');
      if (session) {
        fetch(`${BACKEND}/api/auth/me`, { headers: { 'Authorization': 'Bearer ' + session } })
          .then(r => r.json()).then(d => {
            if (d.ok) {
              const p = new URLSearchParams(location.search);
              const teamSlug = (p.get('team') || '').replace(/[^a-z0-9-]/g, '');
              let redirect = p.get('next') || (teamSlug ? '/#/' + teamSlug : '/');
              if (redirect.startsWith('#')) redirect = '/' + redirect;
              location.href = redirect;
            } else {
              localStorage.removeItem('atslip_session');
              localStorage.removeItem('atslip_user');
              localStorage.removeItem('atslip_photo');
            }
          }).catch(() => {});
      }
      document.getElementById('usernameInput').focus();
    });
  </script>
</body>
</html>
